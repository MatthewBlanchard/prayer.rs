[package]
name = "prayer-api"
version = "0.1.0"
default-run = "prayer-api"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
heap-profile = ["dep:dhat"]

[dependencies]
prayer-api-contracts.workspace = true
prayer-runtime = { path = "../prayer-runtime" }
prayer-state.workspace = true
prayer-sdk.workspace = true
prayer-actions.workspace = true
prayer-scheduler.workspace = true
prayer-lang.workspace = true
spacemolt-lib-rs = { path = "../spacemolt-lib-rs" }
axum.workspace = true
tokio = { workspace = true, features = ["signal"] }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
uuid.workspace = true
chrono.workspace = true
dirs.workspace = true
tower-http.workspace = true
http-body-util = "0.1"
dhat = { version = "0.3", optional = true }

[dev-dependencies]
tower = "0.5"
async-trait.workspace = true
prayer-sdk = { workspace = true, features = ["test-support"] }
